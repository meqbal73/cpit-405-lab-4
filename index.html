<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Great Auto Parts - Order Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Great Auto Parts - Order Form</h1>

    <form action="#" method="post">
      <label for="fname">First Name:</label>
      <input type="text" id="fname" name="fname" placeholder="Enter your first name" required>

      <label for="lname">Last Name:</label>
      <input type="text" id="lname" name="lname" placeholder="Enter your last name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email address" required>

      <label for="phone">Phone number:</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

      <label for="make">Make:</label>
      <input type="text" id="make" name="make" placeholder="Make">

      <label for="model">Model:</label>
      <input type="text" id="model" name="model" placeholder="Model">

      <label for="year">Year:</label>
      <input type="number" id="year" name="year" placeholder="Year" min="1900" max="2100">

      <label for="date">Date:</label>
      <input type="date" id="date" name="date">

      <label for="part">Spare Part:</label>
      <input type="text" id="part" name="part" placeholder="Enter the spare part you need" required>

      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" name="quantity" placeholder="Enter the quantity of the spare part you need" min="1">

      <label for="comment">Comment:</label>
      <textarea id="comment" name="comment" rows="10" placeholder="Enter your comment"></textarea>

      <input type="submit" value="Submit">
    </form>
  </div>
</body>
</html>
